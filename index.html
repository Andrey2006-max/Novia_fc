<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Novia FC - Informes</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #ff4d6d, #ffc2d1);
      margin: 0;
      color: #333;
    }

    header {
      text-align: center;
      padding: 30px;
      color: white;
    }

    .login {
      text-align: center;
      margin-top: 80px;
    }

    .formulario {
      background: white;
      padding: 20px;
      margin: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      display: none;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: transform 0.2s;
      position: relative;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
    }

    .prohibido { color: #ff2e63; font-weight: bold; }
    .permitido { color: #00c897; font-weight: bold; }

    input, select {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      border: 1px solid #ccc;
      width: 90%;
    }

    button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: #ff4d6d;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }

    .stats {
      text-align: center;
      color: white;
      margin-bottom: 10px;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: white;
    }
  </style>
</head>
<body>

<header>
  <h1>💘 Novia FC</h1>
  <p>Sistema oficial 😎</p>
</header>

<div class="stats" id="stats"></div>

<div class="login" id="login">
  <h2>🔐 Acceso</h2>
  <input type="password" id="password" placeholder="Contraseña">
  <br>
  <button onclick="login()">Entrar</button>
</div>

<div class="formulario" id="formulario">
  <h3>➕ Nuevo informe</h3>
  <input type="date" id="fecha">
  <select id="estado">
    <option value="prohibido">❌ Prohibido</option>
    <option value="permitido">✅ Permitido</option>
  </select>
  <input type="text" id="detalle" placeholder="Detalle...">
  <button onclick="agregarInforme()">Agregar</button>
</div>

<div class="container" id="contenedor"></div>

<footer>
  <p>Novia FC © 2026 💘</p>
</footer>

<script>
const PASSWORD = "novia123";

function login() {
  const pass = document.getElementById('password').value;
  if (pass === PASSWORD) {
    document.getElementById('login').style.display = 'none';
    document.getElementById('formulario').style.display = 'block';
    localStorage.setItem('auth', 'true');
  } else {
    alert('Contraseña incorrecta 😅');
  }
}

function agregarInforme() {
  const fecha = document.getElementById('fecha').value;
  const estado = document.getElementById('estado').value;
  const detalle = document.getElementById('detalle').value;

  if (!fecha || !detalle) {
    alert('Completa todos los campos');
    return;
  }

  const contenedor = document.getElementById('contenedor');
  const card = document.createElement('div');
  card.className = 'card';

  const estadoTexto = estado === 'prohibido' ? '❌ Prohibido salir' : '✅ Permitido salir';
  const clase = estado === 'prohibido' ? 'prohibido' : 'permitido';

  card.innerHTML = `
    <button class="delete-btn" onclick="eliminar(this)">X</button>
    <h3>📅 ${fecha}</h3>
    <p class="${clase}">${estadoTexto}</p>
    <p>${detalle}</p>
  `;

  contenedor.appendChild(card);
  guardarDatos();
  actualizarStats();
}

function eliminar(btn) {
  btn.parentElement.remove();
  guardarDatos();
  actualizarStats();
}

function guardarDatos() {
  localStorage.setItem('informes', document.getElementById('contenedor').innerHTML);
}

function cargarDatos() {
  const datos = localStorage.getItem('informes');
  if (datos) {
    document.getElementById('contenedor').innerHTML = datos;
  }

  const auth = localStorage.getItem('auth');
  if (auth === 'true') {
    document.getElementById('login').style.display = 'none';
    document.getElementById('formulario').style.display = 'block';
  }

  actualizarStats();
}

function actualizarStats() {
  const cards = document.querySelectorAll('.card');
  let permitidos = 0;
  let prohibidos = 0;

  cards.forEach(card => {
    if (card.innerText.includes('Permitido')) permitidos++;
    if (card.innerText.includes('Prohibido')) prohibidos++;
  });

  document.getElementById('stats').innerText = `📊 Permitidos: ${permitidos} | ❌ Prohibidos: ${prohibidos}`;
}

cargarDatos();
</script>

</body>
</html>
