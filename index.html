<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novia FC</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
  transition: 0.3s;
}

.light {
  background: linear-gradient(135deg, #ff4d6d, #ffc2d1);
  color: #333;
}

.dark {
  background: #1e1e1e;
  color: white;
}

header {
  text-align: center;
  padding: 20px;
}

button {
  padding: 10px 15px;
  border-radius: 20px;
  border: none;
  cursor: pointer;
  margin: 5px;
}

.toggle {
  background: black;
  color: white;
}

.container {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  position: relative;
}

.dark .card {
  background: #2c2c2c;
}

.delete-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: red;
  color: white;
  border-radius: 50%;
  width: 25px;
  height: 25px;
}

.prohibido { color: red; }
.permitido { color: green; }

.formulario {
  display: none;
  text-align: center;
}

.login {
  text-align: center;
  margin-top: 100px;
}

.welcome {
  position: fixed;
  width: 100%;
  height: 100%;
  background: #ff4d6d;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 24px;
  z-index: 10;
}

.stats {
  text-align: center;
  margin: 10px;
}
</style>
</head>

<body class="light">

<div class="welcome" id="welcome">💘 Bienvenida a Novia FC 💘</div>

<header>
  <h1>💘 Novia FC</h1>
  <button class="toggle" onclick="toggleModo()">🌙/☀️</button>
</header>

<div class="stats" id="stats"></div>

<div class="login" id="login">
  <h2>🔐 Acceso</h2>
  <input type="password" id="password" placeholder="Contraseña">
  <br>
  <button onclick="login()">Entrar</button>
</div>

<div class="formulario" id="formulario">
  <input type="date" id="fecha">
  <select id="estado">
    <option value="prohibido">❌ Prohibido</option>
    <option value="permitido">✅ Permitido</option>
  </select>
  <input type="text" id="detalle" placeholder="Detalle">
  <button onclick="agregarInforme()">Agregar</button>
</div>

<div class="container" id="contenedor"></div>

<script>
const PASSWORD = "Isa2407";

setTimeout(()=>{
  document.getElementById('welcome').style.display='none';
},2000);

function toggleModo(){
  document.body.classList.toggle('dark');
}

function login(){
  const pass = document.getElementById('password').value;
  if(pass===PASSWORD){
    document.getElementById('login').style.display='none';
    document.getElementById('formulario').style.display='block';
    localStorage.setItem('auth','true');
  } else alert('Incorrecta');
}

function agregarInforme(){
  const fecha = document.getElementById('fecha').value;
  const estado = document.getElementById('estado').value;
  const detalle = document.getElementById('detalle').value;

  const cont = document.getElementById('contenedor');
  const card = document.createElement('div');
  card.className='card';

  const clase = estado==='prohibido'?'prohibido':'permitido';
  const texto = estado==='prohibido'?'❌ Prohibido':'✅ Permitido';

  card.innerHTML=`
  <button class="delete-btn" onclick="eliminar(this)">X</button>
  <h3>${fecha}</h3>
  <p class="${clase}">${texto}</p>
  <p>${detalle}</p>
  `;

  cont.appendChild(card);
  guardar(); actualizarStats();
}

function eliminar(btn){
  btn.parentElement.remove();
  guardar(); actualizarStats();
}

function guardar(){
  localStorage.setItem('data',document.getElementById('contenedor').innerHTML);
}

function cargar(){
  const d=localStorage.getItem('data');
  if(d) document.getElementById('contenedor').innerHTML=d;

  if(localStorage.getItem('auth')==='true'){
    document.getElementById('login').style.display='none';
    document.getElementById('formulario').style.display='block';
  }

  actualizarStats();
}

function actualizarStats(){
  let p=0,pr=0;
  document.querySelectorAll('.card').forEach(c=>{
    if(c.innerText.includes('Permitido')) p++;
    if(c.innerText.includes('Prohibido')) pr++;
  });
  document.getElementById('stats').innerText=`Permitidos: ${p} | Prohibidos: ${pr}`;
}

cargar();
</script>

</body>
</html>
